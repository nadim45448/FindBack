<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 240 64" fill="none" aria-label="FindBack" role="img">
  <!--
    FindBack wordmark + mark — DARK-BACKGROUND variant.
    Uses the dark-theme accent (#FB923C) for the mark and a warm white
    for the wordmark text, so it remains legible on dark surfaces
    without relying on CSS variables.
  -->
  <g>
    <rect x="20" y="18" width="16" height="12" rx="2.5" ry="2.5"
          fill="none" stroke="#FB923C" stroke-width="2.25" stroke-linejoin="round"/>
    <line x1="28" y1="18" x2="28" y2="30" stroke="#FB923C" stroke-width="2.25" stroke-linecap="round"/>
    <path d="M28 6
             a16 16 0 0 1 16 16
             c0 8 -7 14 -11 22
             c-1.5 3 -2.5 5 -5 6
             c-2.5 -1 -3.5 -3 -5 -6
             c-4 -8 -11 -14 -11 -22
             a16 16 0 0 1 16 -16 z"
          fill="none" stroke="#FB923C" stroke-width="3" stroke-linejoin="round"/>
    <path d="M28 24 C 36 24, 44 22, 50 18"
          fill="none" stroke="#FB923C" stroke-width="3" stroke-linecap="round"/>
    <path d="M50 18 l-6 0.5 m6 -0.5 l-1.5 -5.5"
          fill="none" stroke="#FB923C" stroke-width="3"
          stroke-linecap="round" stroke-linejoin="round"/>
  </g>
  <text x="76" y="42"
        font-family="system-ui, -apple-system, 'Segoe UI', Roboto, 'Helvetica Neue', Arial, sans-serif"
        font-size="30" font-weight="700" letter-spacing="-0.5"
        fill="#F5EFE5">FindBack</text>
</svg>