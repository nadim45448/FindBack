<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64" fill="none">
  <!--
    FindBack favicon — Pin + Item silhouette only.
    At 16 px the recovery arrow's arrowhead is hard to read, so the favicon
    emphasizes the two most recognizable elements (pin + item inside) and
    simplifies the arrow into a single curved stroke that exits the pin.
    Fixed colors (no currentColor) so it reads in any browser tab.
    Palette: terracotta (#7C2907) on warm linen (#FAF7F2) background.
  -->
  <!-- Background tile (soft rounded square) — provides contrast at 16 px -->
  <rect x="2" y="2" width="60" height="60" rx="14" ry="14" fill="#FAF7F2"/>
  <!-- Item: rounded-rectangle package silhouette -->
  <rect x="20" y="18" width="16" height="12" rx="2.5" ry="2.5"
        fill="#FAF7F2" stroke="#7C2907" stroke-width="3" stroke-linejoin="round"/>
  <line x1="28" y1="18" x2="28" y2="30"
        stroke="#7C2907" stroke-width="3" stroke-linecap="round"/>
  <!-- Pin head: teardrop -->
  <path d="M28 6
           a16 16 0 0 1 16 16
           c0 8 -7 14 -11 22
           c-1.5 3 -2.5 5 -5 6
           c-2.5 -1 -3.5 -3 -5 -6
           c-4 -8 -11 -14 -11 -22
           a16 16 0 0 1 16 -16 z"
        fill="none" stroke="#7C2907" stroke-width="4" stroke-linejoin="round"/>
  <!-- Recovery arrow (simplified — single curve + small arrowhead) -->
  <path d="M28 24 C 36 24, 44 22, 50 18"
        fill="none" stroke="#7C2907" stroke-width="4" stroke-linecap="round"/>
  <path d="M50 18 l-7 0.5 m7 -0.5 l-1.5 -6"
        fill="none" stroke="#7C2907" stroke-width="4"
        stroke-linecap="round" stroke-linejoin="round"/>
</svg>