<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Sign in — FindBack</title>
  <link rel="icon" href="../assets/favicon.svg" type="image/svg+xml">
  <link rel="stylesheet" href="../assets/tokens.css">
  <script>
    (function () {
      try {
        var pref = localStorage.getItem('findback.theme') || 'system';
        var actual = pref === 'system'
          ? (window.matchMedia('(prefers-color-scheme: dark)').matches ? 'dark' : 'light')
          : pref;
        document.documentElement.setAttribute('data-theme', actual);
        document.documentElement.setAttribute('data-theme-pref', pref);
      } catch (e) { document.documentElement.setAttribute('data-theme', 'light'); }
    })();
  </script>
  <style>
    .fb-auth-shell { min-height: calc(100vh - 64px); display: flex; align-items: center; justify-content: center; padding: var(--fb-space-8) var(--fb-page-margin); }
    .fb-auth-card { max-width: 440px; width: 100%; background: var(--fb-surface); border: 1px solid var(--fb-border-subtle); border-radius: var(--fb-radius-lg); padding: var(--fb-space-8); box-shadow: var(--fb-elev-1); }
    .fb-auth-card h1 { font-size: 24px; font-weight: 700; margin: 0 0 var(--fb-space-2); }
    .fb-auth-card p.fb-helper { margin: 0 0 var(--fb-space-6); }
    .fb-auth-card .fb-field + .fb-field { margin-top: var(--fb-space-4); }
    .fb-auth-card .fb-btn { width: 100%; margin-top: var(--fb-space-5); }
    .fb-auth-footer { margin-top: var(--fb-space-6); padding-top: var(--fb-space-5); border-top: 1px solid var(--fb-border-subtle); font-size: 14px; color: var(--fb-on-surface-variant); text-align: center; }
    /* Auth-footer links: weight + underline so they read as links in the resting state, not as plain trailing text. */
    .fb-auth-footer a { font-weight: 600; text-decoration: underline; text-underline-offset: 3px; }
    body { padding-bottom: 80px; }
  </style>
</head>
<body>
  <a href="#main" class="fb-skip-link">Skip to main content</a>

  <header class="fb-topbar">
    <a href="01-landing.html" class="fb-topbar__brand" aria-label="FindBack home">
      <img src="../assets/logo-wordmark-light.svg" alt="FindBack" class="fb-logo-light">
      <img src="../assets/logo-wordmark-dark.svg" alt="FindBack" class="fb-logo-dark" aria-hidden="true">
    </a>
    <div class="fb-topbar__spacer"></div>
    <div class="fb-theme-toggle" data-theme-toggle>
      <button type="button" class="fb-theme-toggle__trigger"
              aria-haspopup="menu" aria-expanded="false"
              aria-label="Theme: System. Click to change."
              title="Theme: System">
        <span class="fb-theme-toggle__icon fb-theme-toggle__icon--half" data-theme-icon aria-hidden="true"></span>
      </button>
      <div class="fb-theme-toggle__menu" role="menu" aria-label="Theme" hidden>
        <button type="button" role="menuitemradio" data-theme-option="system" aria-checked="true">
          <span class="fb-theme-toggle__icon fb-theme-toggle__icon--half" aria-hidden="true"></span>
          <span>System</span>
        </button>
        <button type="button" role="menuitemradio" data-theme-option="light" aria-checked="false">
          <span class="fb-theme-toggle__icon" aria-hidden="true"></span>
          <span>Light</span>
        </button>
        <button type="button" role="menuitemradio" data-theme-option="dark" aria-checked="false">
          <span class="fb-theme-toggle__icon fb-theme-toggle__icon--moon" aria-hidden="true"></span>
          <span>Dark</span>
        </button>
      </div>
    </div>
    <div class="fb-topbar__actions" data-account-menu-slot></div>
  </header>

  <main id="main" tabindex="-1">
    <div class="fb-auth-shell">
      <div class="fb-auth-card">
        <h1>Sign in</h1>
        <p class="fb-helper">Enter your email and password to access your FindBack account.</p>
        <form data-login-form novalidate>
          <!-- Login-failure alert. Lives INSIDE the form so the submit
               handler's form.querySelector('[data-login-error]') can find it.
               Starts hidden; only populated after a failed sign-in
               (invalid credentials) or when ?blocked= is set. Distinct from
               the field-validation summary used by attachFormValidation. -->
          <div class="fb-form-error" data-login-error id="login-error-summary" role="alert" aria-live="assertive" hidden></div>
          <div class="fb-field">
            <label class="fb-field__label" for="email">Email</label>
            <input class="fb-input" type="email" id="email" name="email" autocomplete="email" required aria-describedby="login-error-summary">
          </div>
          <div class="fb-field">
            <label class="fb-field__label" for="password">Password</label>
            <input class="fb-input" type="password" id="password" name="password" autocomplete="current-password" required aria-describedby="login-error-summary">
            <p class="fb-helper"><a href="09-forgot-password.html">Forgot your password?</a></p>
          </div>
          <button type="submit" class="fb-btn fb-btn--primary">Sign in</button>
        </form>

        <div class="fb-auth-footer">
          New to FindBack? <a href="03-register.html">Create an account</a>
        </div>
      </div>
    </div>
  </main>

  <script>
    // The login-failure alert is rendered/cleared by app.js (handleLoginForm).
    // This inline script only runs when ?blocked=rejected|deactivated is present
    // (a guarded page redirected the user back to Login after a state change).
    (function () {
      function showBlocked(reason) {
        var err = document.querySelector('[data-login-error]');
        if (!err) return;
        if (reason === 'rejected' || reason === 'deactivated') {
          err.textContent = "We couldn't sign you in. Your account is not active. If you think this is a mistake, contact your administrator.";
          err.hidden = false;
        } else if (reason === 'pending') {
          err.textContent = "Your account is awaiting administrator approval. You'll be able to sign in once it's approved.";
          err.hidden = false;
        }
      }
      document.addEventListener('DOMContentLoaded', function () {
        var blocked = new URLSearchParams(window.location.search).get('blocked');
        if (blocked) showBlocked(blocked);
      });
      // Expose so app.js can re-show this on a same-page redirect without reload.
      window.FB = window.FB || {};
      window.FB.showLoginBlocked = showBlocked;
    })();
  </script>

  <nav class="fb-mockup-nav" aria-label="Mockup navigation" style="position:fixed; bottom:0; left:0; right:0; background: var(--fb-surface); border-top: 1px solid var(--fb-border-subtle); padding: var(--fb-space-3) var(--fb-page-margin); z-index: var(--fb-z-sticky); font-size: 13px;">
    <div style="max-width: var(--fb-container-max); margin: 0 auto; display: flex; align-items: center; justify-content: space-between; gap: var(--fb-space-4);">
      <span style="color: var(--fb-on-surface-variant); font-weight: 500;">UJ-1 Maya · Step 1 of 13</span>
      <div style="display: flex; gap: var(--fb-space-4);">
        <a href="01-landing.html">← Previous</a>
        <a href="../index.html">All journeys</a>
        <a href="../member/01-listings-anon.html">Next →</a>
      </div>
    </div>
  </nav>

  <script src="../assets/state.js"></script>
  <script src="../assets/app.js"></script>
</body>
</html>
