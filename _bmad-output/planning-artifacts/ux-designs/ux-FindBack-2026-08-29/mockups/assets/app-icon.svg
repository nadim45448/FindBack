<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" fill="none">
  <!--
    FindBack app icon (512×512).
    For OS app launchers / PWA install. The mark sits on a soft warm
    rounded-square background in the brand primary so it reads as a
    coherent tile at any size.
    Construction mirrors logo-mark.svg but scaled to a 512 canvas with
    a generous safe area (≈ 12% inset).
  -->
  <!-- Background tile -->
  <rect x="0" y="0" width="512" height="512" rx="115" ry="115" fill="#7C2907"/>
  <!-- Item: rounded-rectangle package silhouette, knockout in on-primary -->
  <rect x="160" y="158" width="128" height="96" rx="20" ry="20"
        fill="#FFFFFF" stroke="#FFFFFF" stroke-width="6" stroke-linejoin="round"/>
  <line x1="224" y1="158" x2="224" y2="254" stroke="#7C2907" stroke-width="14" stroke-linecap="round"/>
  <!-- Pin head: teardrop (knockout inside the brand tile) -->
  <path d="M224 48
           a128 128 0 0 1 128 128
           c0 64 -56 112 -88 176
           c-12 24 -20 40 -40 48
           c-20 -8 -28 -24 -40 -48
           c-32 -64 -88 -112 -88 -176
           a128 128 0 0 1 128 -128 z"
        fill="none" stroke="#FFFFFF" stroke-width="22" stroke-linejoin="round"/>
  <!-- Recovery arrow -->
  <path d="M224 192
           C 288 192, 352 176, 400 144"
        fill="none" stroke="#FFFFFF" stroke-width="22" stroke-linecap="round"/>
  <path d="M400 144 l-48 4 m48 -4 l-12 -44"
        fill="none" stroke="#FFFFFF" stroke-width="22"
        stroke-linecap="round" stroke-linejoin="round"/>
</svg>