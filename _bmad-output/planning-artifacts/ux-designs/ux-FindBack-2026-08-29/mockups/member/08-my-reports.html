<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>My reports — FindBack</title>
  <link rel="icon" href="../assets/favicon.svg" type="image/svg+xml">
  <link rel="stylesheet" href="../assets/tokens.css">
  <script>
    (function () {
      try {
        var pref = localStorage.getItem('findback.theme') || 'system';
        var actual = pref === 'system'
          ? (window.matchMedia('(prefers-color-scheme: dark)').matches ? 'dark' : 'light')
          : pref;
        document.documentElement.setAttribute('data-theme', actual);
        document.documentElement.setAttribute('data-theme-pref', pref);
      } catch (e) { document.documentElement.setAttribute('data-theme', 'light'); }
    })();
  </script>
  <style>
    .fb-page { max-width: var(--fb-container-max); margin: 0 auto; padding: var(--fb-space-6) var(--fb-page-margin); }
    body { padding-bottom: 80px; }
  </style>
</head>
<body>
  <a href="#main" class="fb-skip-link">Skip to main content</a>

  <header class="fb-topbar">
    <a href="../public/01-landing.html" class="fb-topbar__brand" aria-label="FindBack home">
      <img src="../assets/logo-wordmark-light.svg" alt="FindBack" class="fb-logo-light">
      <img src="../assets/logo-wordmark-dark.svg" alt="FindBack" class="fb-logo-dark" aria-hidden="true">
    </a>
    <nav class="fb-topbar__nav" aria-label="Primary">
      <a href="02-listings-member.html">Lost &amp; Found</a>
      <a href="08-my-reports.html" aria-current="page">My reports</a>
      <a href="10-my-claims.html">My claims</a>
      <a href="18-my-recovery-responses.html">My recovery responses</a>
    </nav>
    <div class="fb-topbar__spacer"></div>
    <div class="fb-theme-toggle" data-theme-toggle>
      <button type="button" class="fb-theme-toggle__trigger"
              aria-haspopup="menu" aria-expanded="false"
              aria-label="Theme: System. Click to change."
              title="Theme: System">
        <span class="fb-theme-toggle__icon fb-theme-toggle__icon--half" data-theme-icon aria-hidden="true"></span>
      </button>
      <div class="fb-theme-toggle__menu" role="menu" aria-label="Theme" hidden>
        <button type="button" role="menuitemradio" data-theme-option="system" aria-checked="true">
          <span class="fb-theme-toggle__icon fb-theme-toggle__icon--half" aria-hidden="true"></span>
          <span>System</span>
        </button>
        <button type="button" role="menuitemradio" data-theme-option="light" aria-checked="false">
          <span class="fb-theme-toggle__icon" aria-hidden="true"></span>
          <span>Light</span>
        </button>
        <button type="button" role="menuitemradio" data-theme-option="dark" aria-checked="false">
          <span class="fb-theme-toggle__icon fb-theme-toggle__icon--moon" aria-hidden="true"></span>
          <span>Dark</span>
        </button>
      </div>
    </div>
    <div class="fb-topbar__actions" data-account-menu-slot></div>
  </header>

  <main id="main" tabindex="-1" class="fb-page" data-page="my-reports">
    <div class="fb-row fb-row--between" style="margin-bottom: var(--fb-space-5); flex-wrap: wrap; gap: var(--fb-space-3);">
      <h1 class="fb-h2">My reports</h1>
      <div class="fb-row">
        <a href="14-report-lost.html" class="fb-btn fb-btn--primary fb-btn--sm">Report lost</a>
        <a href="15-report-found.html" class="fb-btn fb-btn--secondary fb-btn--sm">Report found</a>
      </div>
    </div>

    <div class="fb-filter-card" style="margin-bottom: var(--fb-space-4);">
      <h3>Filter</h3>
      <div class="fb-field">
        <label class="fb-field__label" for="filter-status">Status</label>
        <select class="fb-select" id="filter-status" data-filter="status">
          <option value="">All</option>
          <option value="open">Open</option>
          <option value="claimRequested">Claim Requested</option>
          <option value="claimApproved">Claim Approved</option>
          <option value="returned">Returned</option>
          <option value="closed">Closed</option>
        </select>
      </div>
    </div>

    <section data-reports-list aria-live="polite">
      <div class="fb-listings__empty">Loading…</div>
    </section>
  </main>

  <nav class="fb-mockup-nav" aria-label="Mockup navigation" style="position:fixed; bottom:0; left:0; right:0; background: var(--fb-surface); border-top: 1px solid var(--fb-border-subtle); padding: var(--fb-space-3) var(--fb-page-margin); z-index: var(--fb-z-sticky); font-size: 13px;">
    <div style="max-width: var(--fb-container-max); margin: 0 auto; display: flex; align-items: center; justify-content: space-between; gap: var(--fb-space-4);">
      <span style="color: var(--fb-on-surface-variant); font-weight: 500;" data-mockup-context>UJ-2 Sam · Step 5 of 8</span>
      <div style="display: flex; gap: var(--fb-space-4);">
        <a href="07-dashboard.html">← Previous</a>
        <a href="../index.html">All journeys</a>
        <a href="09-edit-report.html">Next →</a>
      </div>
    </div>
  </nav>

  <script src="../assets/state.js"></script>
  <script src="../assets/app.js"></script>
  <script>
    document.addEventListener('DOMContentLoaded', function () {
      if (!window.FB || !window.FB.state) return;
      var user = window.FB.state.getCurrentUser();
      if (!user) { window.location.href = '../public/02-login.html'; return; }
      if (user.role === 'administrator') { window.location.href = '../admin/01-dashboard.html'; return; }

      var ctx = document.querySelector('[data-mockup-context]');
      if (ctx) ctx.textContent = user.name + ' · My reports';

      var filterStatus = '';
      var reports = window.FB.state.listReportsForUser(user.id);
      reports.sort(function (a, b) { return a.updatedAt < b.updatedAt ? 1 : -1; });

      function escapeHtml(s) { return String(s || '').replace(/[&<>"']/g, function (m) { return ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'})[m]; }); }
      function statusLabel(s) { return ({open:'Open', claimRequested:'Claim Requested', claimApproved:'Claim Approved', returned:'Returned', closed:'Closed'})[s] || s; }

      function render() {
        var list = document.querySelector('[data-reports-list]');
        var rows = reports.filter(function (r) { return !filterStatus || r.status === filterStatus; });
        if (!rows.length) {
          list.innerHTML = '<div class="fb-listings__empty"><strong>You haven\'t reported anything yet.</strong><div>Use <a href="14-report-lost.html">Report lost</a> or <a href="15-report-found.html">Report found</a> to start.</div></div>';
          return;
        }
        var html = '<table class="fb-table"><thead><tr><th>Item</th><th>Type</th><th>Date</th><th>Status</th><th>Claims</th></tr></thead><tbody>';
        rows.forEach(function (r) {
          var claims = window.FB.state.listClaimsForReport(r.id);
          var pending = claims.filter(function (c) { return c.status === 'pending'; }).length;
          var approved = claims.filter(function (c) { return c.status === 'approved'; }).length;
          var rejected = claims.filter(function (c) { return c.status === 'rejected'; }).length;
          var claimsTxt = approved + ' approved · ' + pending + ' pending' + (rejected ? ' · ' + rejected + ' rejected' : '');
          var detailHref = '04-item-detail-reporter.html?item=' + r.id;
          html += '<tr onclick="window.location.href=\'' + detailHref + '\';">' +
                  '  <td data-label="Item"><strong>' + escapeHtml(r.name) + '</strong><div class="fb-cell-meta">' + escapeHtml(r.category) + ' · ' + escapeHtml(r.campusArea) + '</div></td>' +
                  '  <td data-label="Type"><span class="fb-type-badge fb-type-badge--' + r.type + '">' + (r.type === 'lost' ? 'Lost' : 'Found') + '</span></td>' +
                  '  <td data-label="Date">' + window.fbFormatDate(r.date) + '</td>' +
                  '  <td data-label="Status"><span class="fb-status fb-status--report-' + r.status + '">' + statusLabel(r.status) + '</span></td>' +
                  '  <td data-label="Claims">' + claimsTxt + '</td>' +
                  '</tr>';
        });
        html += '</tbody></table>';
        list.innerHTML = html;
      }

      var sel = document.getElementById('filter-status');
      if (sel) sel.addEventListener('change', function () { filterStatus = sel.value; render(); });
      render();
    });
  </script>
</body>
</html>
