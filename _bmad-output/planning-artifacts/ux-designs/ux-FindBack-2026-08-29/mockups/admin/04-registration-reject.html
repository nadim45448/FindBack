<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Reject registration — FindBack</title>
  <link rel="icon" href="../assets/favicon.svg" type="image/svg+xml">
  <link rel="stylesheet" href="../assets/tokens.css">
  <script>
    (function () {
      try {
        var pref = localStorage.getItem('findback.theme') || 'system';
        var actual = pref === 'system'
          ? (window.matchMedia('(prefers-color-scheme: dark)').matches ? 'dark' : 'light')
          : pref;
        document.documentElement.setAttribute('data-theme', actual);
        document.documentElement.setAttribute('data-theme-pref', pref);
      } catch (e) { document.documentElement.setAttribute('data-theme', 'light'); }
    })();
  </script>
  <style>
    .fb-page { max-width: var(--fb-container-narrow); margin: 0 auto; padding: var(--fb-space-6) var(--fb-page-margin); padding-top: calc(var(--fb-space-6) + 40px); }
    .fb-field + .fb-field { margin-top: var(--fb-space-4); }
    .fb-actions { display: flex; justify-content: flex-end; gap: var(--fb-space-3); margin-top: var(--fb-space-6); flex-wrap: wrap; }
    body { padding-bottom: 80px; }
  </style>
</head>
<body class="fb-topbar--admin">
  <a href="#main" class="fb-skip-link">Skip to main content</a>

  <header class="fb-topbar">
    <a href="01-dashboard.html" class="fb-topbar__brand" aria-label="FindBack home">
      <img src="../assets/logo-wordmark-light.svg" alt="FindBack" class="fb-logo-light">
      <img src="../assets/logo-wordmark-dark.svg" alt="FindBack" class="fb-logo-dark" aria-hidden="true">
    </a>
    <nav class="fb-topbar__nav" aria-label="Primary">
      <a href="01-dashboard.html">Dashboard</a>
      <a href="02-pending-registrations.html" aria-current="page">Registrations</a>
      <a href="05-pending-claims.html">Claims</a>
      <a href="09-items-awaiting-return.html">Awaiting return</a>
      <a href="12-audit-trail.html">Audit trail</a>
    </nav>
    <div class="fb-topbar__spacer"></div>
    <div class="fb-theme-toggle" data-theme-toggle>
      <button type="button" class="fb-theme-toggle__trigger"
              aria-haspopup="menu" aria-expanded="false"
              aria-label="Theme: System. Click to change."
              title="Theme: System">
        <span class="fb-theme-toggle__icon fb-theme-toggle__icon--half" data-theme-icon aria-hidden="true"></span>
      </button>
      <div class="fb-theme-toggle__menu" role="menu" aria-label="Theme" hidden>
        <button type="button" role="menuitemradio" data-theme-option="system" aria-checked="true">
          <span class="fb-theme-toggle__icon fb-theme-toggle__icon--half" aria-hidden="true"></span>
          <span>System</span>
        </button>
        <button type="button" role="menuitemradio" data-theme-option="light" aria-checked="false">
          <span class="fb-theme-toggle__icon" aria-hidden="true"></span>
          <span>Light</span>
        </button>
        <button type="button" role="menuitemradio" data-theme-option="dark" aria-checked="false">
          <span class="fb-theme-toggle__icon fb-theme-toggle__icon--moon" aria-hidden="true"></span>
          <span>Dark</span>
        </button>
      </div>
    </div>
    <div class="fb-topbar__actions" data-account-menu-slot></div>
  </header>

  <main id="main" tabindex="-1" class="fb-page">
    <div data-admin-root>
      <div class="fb-listings__empty">Loading…</div>
    </div>
  </main>

  <nav class="fb-mockup-nav" aria-label="Mockup navigation" style="position:fixed; bottom:0; left:0; right:0; background: var(--fb-surface); border-top: 1px solid var(--fb-border-subtle); padding: var(--fb-space-3) var(--fb-page-margin); z-index: var(--fb-z-sticky); font-size: 13px;">
    <div style="max-width: var(--fb-container-max); margin: 0 auto; display: flex; align-items: center; justify-content: space-between; gap: var(--fb-space-4);">
      <span style="color: var(--fb-on-surface-variant); font-weight: 500;">UJ-3 Alex · Step 5b (reject — alternate)</span>
      <div style="display: flex; gap: var(--fb-space-4);">
        <a href="03-registration-approve.html">← Previous</a>
        <a href="../index.html">All journeys</a>
        <a href="05-pending-claims.html">Next →</a>
      </div>
    </div>
  </nav>

  <script src="../assets/state.js"></script>
  <script src="../assets/admin-renderer.js"></script>
  <script src="../assets/app.js"></script>
  <script>
    document.addEventListener('DOMContentLoaded', function () {
      if (!window.FB || !window.FB.state) return;
      var admin = window.FB.state.getCurrentUser();
      if (!admin || admin.role !== 'administrator') {
        window.location.href = '../public/02-login.html';
        return;
      }
      var esc = window.FB.adminRender.escapeHtml;
      var params = new URLSearchParams(window.location.search);
      var regId = params.get('reg');
      var regs = window.FB.state.listRegistrations();
      var reg = regs.find(function (r) { return r.id === regId; }) || regs.find(function (r) { return !r.decision; });
      if (!reg) {
        document.querySelector('[data-admin-root]').innerHTML = '<div class="fb-listings__empty"><strong>No pending registrations.</strong></div>';
        return;
      }
      var root = document.querySelector('[data-admin-root]');
      var html = '';
      html += '<nav class="fb-helper" aria-label="Breadcrumb" style="margin-bottom: var(--fb-space-3);">';
      html += '  <a href="02-pending-registrations.html">Pending registrations</a> › <span aria-current="page">' + esc(reg.name) + ' — reject</span>';
      html += '</nav>';
      html += '<h1 class="fb-h2" style="margin-bottom: var(--fb-space-5);">Reject registration</h1>';
      html += '<div class="fb-card" style="margin-bottom: var(--fb-space-5);">';
      html += '  <dl style="margin: 0;">';
      html += '    <div style="margin-bottom: var(--fb-space-3);"><dt class="fb-caption">Name</dt><dd style="margin: 2px 0 0;"><strong>' + esc(reg.name) + '</strong></dd></div>';
      html += '    <div><dt class="fb-caption">Email</dt><dd style="margin: 2px 0 0;"><code style="font-size: 13px;">' + esc(reg.email) + '</code></dd></div>';
      html += '  </dl>';
      html += '</div>';
      html += '<div class="fb-form-error" data-reject-error role="alert" hidden></div>';
      html += '<form data-reject-form>';
      html += '  <div class="fb-field">';
      html += '    <label class="fb-field__label" for="reason">Rejection reason <span class="fb-req" aria-hidden="true">*</span></label>';
      html += '    <textarea class="fb-textarea" id="reason" name="reason" required minlength="5" placeholder="At least 5 characters. Recorded in the audit trail but not shown to the rejected user."></textarea>';
      html += '    <p class="fb-field__help">The user sees a generic "your account is not active" message. They don\'t see this reason.</p>';
      html += '  </div>';
      html += '  <div class="fb-actions">';
      html += '    <a href="02-pending-registrations.html" class="fb-btn fb-btn--tertiary">Cancel</a>';
      html += '    <button type="submit" class="fb-btn fb-btn--danger">Reject account</button>';
      html += '  </div>';
      html += '</form>';
      root.innerHTML = html;
      var form = root.querySelector('[data-reject-form]');
      var errEl = root.querySelector('[data-reject-error]');
      window.FB.attachFormValidation(form, {
        summaryEl: errEl,
        fields: [
          { input: form.querySelector('[name="reason"]'), label: 'Rejection reason',
            validate: function (v) {
              if (!v) return 'Rejection reason is required.';
              if (v.length < 5) return 'Rejection reason must be at least 5 characters.';
              return true;
            }
          }
        ],
        onSubmit: function () {
          var reason = form.querySelector('[name="reason"]').value.trim();
          var updated = window.FB.state.rejectRegistration(reg.id, admin.id, reason);
          if (!updated) {
            window.FB.toast('This application was already reviewed.', 'error');
            window.location.href = '02-pending-registrations.html';
            return;
          }
          window.FB.toast('Account rejected. Rejection recorded in audit trail.', 'success');
          setTimeout(function () { window.location.href = '02-pending-registrations.html'; }, 250);
        }
      });
    });
  </script>
</body>
</html>
